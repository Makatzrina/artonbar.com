# Jekyll config for GitHub Pages.
# Pages keep their own <head>; only the shared nav and footer live in _includes/.
title: ArtOnBar
url: https://www.artonbar.com

# ------------------------------------------------------------------
# MONEY SETTINGS — this is the only file you need to edit.
# After changing anything here, commit + push; GitHub Pages rebuilds.
# ------------------------------------------------------------------

# GetYourGuide partner ID (partner.getyourguide.com → Profile).
# Used by every GYG link and widget on the site.
gyg_partner_id: "EAQF7O2"

# Booking.com affiliate ID (admin.booking.com/affiliate → "aid" number).
# Leave empty ("") until you have one; links then stay plain.
booking_aid: ""

# Newsletter provider. Paste the form "action" URL from your provider's
# embedded-form code (MailerLite, Mailchimp, Buttondown, Beehiiv all work).
# Leave empty to keep sending sign-ups to your FormSubmit inbox.
newsletter_form_action: ""
# Name of the email field your provider expects:
#   MailerLite: "fields[email]"   Mailchimp: "EMAIL"   Buttondown/Beehiiv: "email"
newsletter_email_field: "email"

# "List Your Bar" packages. Prices are shown as-is (change freely).
pricing:
  header_banner:   "€149"   # banner under the menu, every page of the site
  featured_month:  "€49"    # top of one town page
  homepage_month:  "€99"    # homepage card + top of the town page, one bar for the whole Algarve
  sponsored_post:  "€99"

# Stripe Payment Links (dashboard.stripe.com → Payment Links → create one per package).
# Leave empty and the buttons open the enquiry form instead of a checkout.
stripe_links:
  header_banner:   ""
  featured_month:  "https://buy.stripe.com/eVqdR8bau6fme5845NfEk04"
  homepage_month:  ""
  sponsored_post:  ""

# Header banner: shown under the menu on every page. Leave image empty to
# show the "your banner here" placeholder instead.
#   image:        desktop creative, 728×90 shown (supply 1456×180 for sharp screens), PNG/JPG/WebP
#   image_mobile: phone creative, 320×100 shown (supply 640×200). Falls back to the desktop image.
#   url:          where a click goes (opens in a new tab, marked as sponsored)
#   alt:          what the banner says, for screen readers and if the image fails
#   label:        small text above the banner; keep it honest ("Advertisement", "Partner")
#   html:         name of an HTML creative in _includes/ (text rendered live, can animate).
#                 Takes precedence over image. Leave "" to use an image.
header_banner:
  html:         "banner-marinai.html"
  image:        ""
  image_mobile: ""
  url:          "https://marinai.xyz/agent-check"
  alt:          "Is your website accessible to zombies? AI agents now pick bars for tourists. Free check at marinai.xyz"
  label:        "Advertisement"

# Traffic figures shown on the "List Your Bar" page (from GA4, last 30 days).
# Update monthly; leave visitors empty to hide the block.
traffic:
  period:   "last 30 days, to 17 November 2026"
  visitors: "57,000"
  views:    "127,000"
  growth:   "+19%"

# whitelist lets the plugin run in `jekyll build --safe` locally; GitHub Pages whitelists it anyway
whitelist:
  - jekyll-redirect-from
plugins:
  - jekyll-redirect-from

# Keep these out of the published site
exclude:
  - README.md
  - MONETISATION.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

# Don't run Markdown on anything; everything is hand-written HTML.
# The Markdown twins (<page>/index.md, for AI agents) must be served as raw
# text. GitHub Pages force-enables jekyll-optional-front-matter, which would
# otherwise convert every .md into a page and overwrite the real index.html.
# Dropping "md" from markdown_ext makes .md files plain static files.
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd"
