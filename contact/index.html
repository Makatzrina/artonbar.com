<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact ArtOnBar — Tips, Corrections &amp; Bar Enquiries</title>
  <meta name="description" content="Get in touch with ArtOnBar: recommend a bar, correct an opening time, ask about a featured listing, or just say hello. Replies within 48 hours.">
  <link rel="canonical" href="https://www.artonbar.com/contact/">
  <link rel="alternate" type="text/markdown" href="/contact/index.md" title="This page as Markdown">
  <link rel="alternate" type="application/json" href="/api/bars.json" title="All bars (JSON)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K767LQ3EEK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K767LQ3EEK');
  </script>
  <meta property="og:image" content="https://www.artonbar.com/og-image.png">
  <meta property="og:image:width" content="1200">

<body>

{% include nav.html %}

<section class="page-hero">
  <div class="container">
    <div class="page-hero__label">Contact</div>
    <h1>Get in touch</h1>
    <p class="page-hero__sub">Bar recommendation you think I've missed? Correction? Just want to talk drinks? I read everything. I usually reply within 48 hours.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <form class="form-grid js-contact-form" data-form-subject="ArtOnBar Contact" novalidate>
      <div class="form-field">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" placeholder="Name" required>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@email.com" required>
      </div>
      <div class="form-field">
        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="">Select a topic</option>
          <option>Bar recommendation</option>
          <option>Correction / update</option>
          <option>Featured listing enquiry</option>
          <option>Press / media</option>
          <option>Something else</option>
        </select>
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="What's on your mind?" rows="5" required></textarea>
      </div>
      <div>
        <button type="submit" class="btn btn--primary">Send message</button>
      </div>
    </form>
  </div>
</section>

{% include footer.html %}
<script src="/js/main.js"></script>
</body>
</html>
